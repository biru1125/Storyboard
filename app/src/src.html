<title>스토리보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("conti-theme")||"dark"}catch(_){document.documentElement.dataset.theme="dark"}</script>
<style>
/* 화면 구성: 위 도구막대 / 왼쪽 화 목록 / 오른쪽 세로 9:16 컷 카드. ☰ 는 프로젝트 목록 서랍 */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#F1F3F6; --hover:#EBEEF2; --ink:#15181C; --muted:#5F6773; --faint:#8C939D; --line:#E1E4E9; --line2:#CDD2D9;
  --accent:#2F66F0; --accent-ink:#FFFFFF; --accent-soft:#E7EEFF; --danger:#D23B3B; --danger-soft:#FDECEC; --ok:#1F9254; --warn:#C27A00;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07); --pop:0 12px 32px rgba(16,24,40,.18);
  --vz-sky:#DDE3E6; --vz-sky2:#CBD4D9; --vz-ground:#C9CCC4; --vz-line:#A9AEA6; --vz-bld:#B9C0C4; --vz-win:#E9EEF0;
  --vz-fig:#7DB8EA; --vz-fig2:#AFC4D3; --vz-ink:#1E3A55; --vz-hair:#3B4A57; --vz-dark:#2B3136; --vz-cam:#2B3136;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D21; --sunk:#15171B; --hover:#24282E; --ink:#E7E9EC; --muted:#A0A7B1; --faint:#737B86; --line:#2A2E35; --line2:#3A3F47;
  --accent:#6E95FF; --accent-ink:#0E1424; --accent-soft:#1D2742; --danger:#FF6B6B; --danger-soft:#3A1F22; --ok:#4CC38A; --warn:#E7A93B;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 14px 40px rgba(0,0,0,.55);
  --vz-sky:#2A3236; --vz-sky2:#334047; --vz-ground:#3A3D37; --vz-line:#4E534B; --vz-bld:#3F474C; --vz-win:#56626A;
  --vz-fig:#6FA9DC; --vz-fig2:#56697A; --vz-ink:#0E2236; --vz-hair:#1A232B; --vz-dark:#0C0F11; --vz-cam:#D9DEE2;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 버튼 */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--hover)}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted)}
.ib:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib.sm{width:26px;height:26px;border-radius:6px} .ib.sm svg.i{width:15px;height:15px}
.ib.del:hover{color:var(--danger);background:var(--danger-soft)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.sub{color:var(--muted);font-size:12px}

/* 위 도구막대 */
header.top{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.pname{display:flex;align-items:center;gap:6px;min-width:0;border:0;background:none;padding:4px 8px;border-radius:8px;font-size:15px;font-weight:700}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.pname:hover{background:var(--hover)}
.pname svg.i{width:14px;height:14px;color:var(--faint)}
.save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;margin-left:4px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.save.ok::before{background:var(--ok)} .save.busy::before{background:var(--warn)}
header .sp{flex:1}
.exp{position:relative}
@media (max-width:1180px){.btn .lbtxt{display:none}.btn:has(.lbtxt){padding:0 9px}}

/* 본문 틀 */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}
.shell.nosb{grid-template-columns:minmax(0,1fr)}
aside.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:18px}
.shd{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.eps{display:flex;flex-direction:column;gap:2px}
.ep{display:flex;align-items:center;border-radius:8px}
.ep:hover{background:var(--hover)}
.ep.sel{background:var(--accent-soft)}
.ep.sel .epb{color:var(--accent);font-weight:700}
.ep.drop{box-shadow:inset 0 2px 0 var(--accent)}
.epb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 8px;text-align:left;font-weight:600;font-size:13.5px}
.epb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epb .n{margin-left:auto;font-family:var(--f-code);font-size:11px;color:var(--faint);font-weight:500}
.ep .ib{opacity:0} .ep:hover .ib,.ep.sel .ib,.ep .ib:focus-visible{opacity:1}
.addrow{display:flex;align-items:center;gap:6px;border:1px dashed var(--line2);border-radius:8px;background:none;padding:7px 10px;color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.addrow:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chlist{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
main{overflow:auto;padding:22px 28px 120px;scroll-padding-top:16px}
.board{max-width:1320px;margin:0 auto}

/* 화 머리 */
.ephd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ephd h2{margin:0;font-size:20px;letter-spacing:-.01em}
.ephd .sub{font-size:13px}
.ephd .sp{flex:1}

/* 컷 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card.dragover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.cid{font-family:var(--f-code);font-weight:600;font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.place{flex:0 1 260px;min-width:80px;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 8px;font-weight:600;font-size:13.5px}
.place:hover{border-color:var(--line)} .place:focus{border-color:var(--accent);outline:0;background:var(--surface)}
.place::placeholder{color:var(--faint);font-weight:500}
.chead .sp{flex:1}
.chead .tools{display:flex;gap:2px;opacity:.55;transition:opacity .12s}
.card:hover .chead .tools,.chead .tools:focus-within{opacity:1}
.cbody{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(0,1.15fr)}
.col{padding:14px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:10px}
.col:last-child{border-right:0}
.lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.lbl .cnt{font-family:var(--f-code);font-weight:500;color:var(--faint)}
.lbl .sub{font-weight:400;letter-spacing:0;font-size:11.5px}
@media (max-width:1180px){.cbody{grid-template-columns:220px minmax(0,1fr)}.col.txt{grid-column:1/-1;border-top:1px solid var(--line);border-right:0}}

/* 컷 사이 + 버튼 */
.gap{position:relative;height:18px;display:flex;align-items:center;justify-content:center}
.gap::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--accent);opacity:0;transition:opacity .12s}
.gap .add{position:relative;opacity:0;transition:opacity .12s;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:0 12px;font-size:12px;font-weight:700;line-height:20px}
.gap:hover::before,.gap:hover .add,.gap .add:focus-visible{opacity:1}
.endadd{width:100%;justify-content:center;height:48px;margin-top:6px;border-style:dashed;color:var(--muted)}
.endadd:hover:not(:disabled){color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* 레퍼런스 */
.frame{position:relative;width:100%;max-width:204px;aspect-ratio:var(--ar,9/16);border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);padding:0;display:block}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty{border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--muted);text-align:center;padding:14px;font-size:13px;font-weight:600}
.frame.empty:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.frame.empty small{display:block;font-weight:400;font-size:11.5px;margin-top:4px;color:var(--faint)}
.mref{position:relative;max-width:204px}
.rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:6px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0;opacity:0;transition:opacity .12s}
.rm svg.i{width:14px;height:14px}
.mref:hover .rm,.th:hover .rm,.rm:focus-visible{opacity:1}
.mref .zoom{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:2px 6px;pointer-events:none;opacity:0;transition:opacity .12s}
.mref:hover .zoom{opacity:1}
.tagline{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tg.hit{border-color:var(--accent);color:var(--accent)}
.src{font-size:11px;color:var(--faint);word-break:break-all;line-height:1.4}
.src a{color:inherit}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:204px}
.th{position:relative;aspect-ratio:var(--ar,9/16)}
.th>button:first-child{width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--sunk);display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .rm{top:2px;right:2px;width:18px;height:18px;border-radius:4px}
.th .rm svg.i{width:11px;height:11px}
.th.add>button{display:grid;place-items:center;border:1.5px dashed var(--line2);color:var(--muted);background:none}
.th.add>button:hover{border-color:var(--accent);color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:204px}
.strip button{padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;aspect-ratio:var(--ar,9/16);background:var(--sunk);position:relative}
/* 가로·정사각 비율 카드는 레퍼런스 칸을 넓힌다 */
.card.wide .cbody{grid-template-columns:340px minmax(0,1fr) minmax(0,1.1fr)}
.card.wide .frame,.card.wide .mref,.card.wide .thumbs,.card.wide .strip{max-width:312px}
.card.wide .thumbs,.card.wide .strip{grid-template-columns:repeat(3,1fr)}
@media (max-width:1180px){.card.wide .cbody{grid-template-columns:330px minmax(0,1fr)}}
.rsel{height:28px;padding:0 6px;font-size:12px;border-color:var(--line);background:var(--surface);color:var(--muted)}
.rsel.own{border-color:var(--accent);color:var(--accent);font-weight:600}
.strip button:hover{border-color:var(--accent)}
.strip button::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);opacity:0;transition:opacity .12s}
.strip button:hover::after{opacity:1}
.strip img{width:100%;height:100%;object-fit:cover;display:block}

/* 카메라 */
select{min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 8px}
.cams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ct{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.ct:hover{border-color:var(--line2);background:var(--hover)}
.ct.hit{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ct .k{font-size:10.5px;color:var(--muted);font-weight:600}
.ct .v{font-size:12.5px;font-weight:600;line-height:1.3;word-break:keep-all}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.op{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:5px;text-align:left}
.op:hover{background:var(--hover)}
.op.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.op .pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.op .ph{aspect-ratio:9/16;border-radius:5px;overflow:hidden;background:var(--sunk);position:relative}
.op .ph img{width:100%;height:100%;object-fit:cover;display:block}
.op .ph span{position:absolute;left:3px;bottom:3px;font-size:9.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:0 4px}
.op b{font-size:13px} .op small{font-size:11.5px;color:var(--muted);line-height:1.4}
.pic{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:5px;overflow:hidden;background:var(--sunk)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pic .glow{background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.55),rgba(255,255,255,.15) 60%,transparent);mix-blend-mode:screen}
.pic .ts{height:32%;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)} .pic .ts.t{top:0;bottom:auto} .pic .ts.b{top:auto;bottom:0}
.pic.mb img{filter:blur(1.6px);transform:translateX(-3px) scale(1.04)}
.pic .tag{inset:auto 4px 4px 4px;width:auto;height:auto;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:600;border-radius:3px;padding:2px 4px;text-align:center}
.pic .ovl .bm-bg{fill:rgba(255,255,255,.85)} .pic .ovl .bm-dim{fill:rgba(20,24,28,.62)} .pic .ovl .bm-hi{fill:none;stroke:#FFC83D;stroke-width:1.4}
.pic .ovl .body{fill:#F1C7A1} .pic .ovl .shirt{fill:#D9534A} .pic .ovl .pants{fill:#2E3B57} .pic .ovl .shoe{fill:#1E1E1E} .pic .ovl .hairc{fill:#2B2220}
.pic .ovl .sl{stroke:#D9534A;stroke-linecap:round;fill:none} .pic .ovl .pl{stroke:#2E3B57;stroke-linecap:round;fill:none} .pic .ovl .ink{fill:#1E3A55} .pic .ovl .ink-l{stroke:#1E3A55;fill:none}
/*VIZCSS*/
.tip{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tip b{color:var(--ink);font-weight:600}

/* 인물 */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--surface);line-height:20px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
button.chip:hover{background:var(--hover)}
.chip[aria-pressed="false"]{opacity:.5;border-style:dashed}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip.addc{border-style:dashed;color:var(--muted)}
.chpick{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:8px;padding:10px}

/* 글 칸 */
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.5px;font-weight:700;color:var(--muted)}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;line-height:1.6;font-size:13.5px;overflow:hidden}
textarea:hover{border-color:var(--line2)} textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
textarea::placeholder{color:var(--faint)}
textarea.dlg{background:var(--sunk)}

/* 대화상자 */
dialog{border:1px solid var(--line);padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--pop)}
dialog.sm{width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.55)}
.pk{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.pkh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pkh .top{display:flex;align-items:center;gap:8px}
.pkh h2{font-size:15px;margin:0;margin-right:auto}
.pkb{overflow:auto;padding:14px 16px}
.pkf{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:none}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column}
.cell>button.im{aspect-ratio:var(--ar,9/16);width:100%;padding:0;border:0;display:block;background:none}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .tl{padding:4px;display:flex;flex-wrap:wrap;gap:3px}
.cell.on{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.cell .ck{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);border:1.5px solid #fff;display:grid;place-items:center;color:#fff;pointer-events:none}
.cell.on .ck{background:var(--accent);border-color:var(--accent)}
.cell .ck svg.i{width:13px;height:13px;stroke-width:3;opacity:0}
.cell.on .ck svg.i{opacity:1}
.cell .ca{display:flex;gap:4px;padding:0 4px 4px}
.cell .ca button{flex:1;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:11px;padding:2px 0}
.cell .ca button:hover{background:var(--hover)}
.empty-note{color:var(--muted);font-size:13px;padding:24px 4px;text-align:center}
.form{display:flex;flex-direction:column;gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form select{border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:14px;color:var(--ink)}
.form input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form p{margin:0;color:var(--ink);font-size:14px;line-height:1.6;white-space:pre-wrap}
.view img{display:block;max-width:100%;max-height:calc(100vh - 160px);margin:0 auto;border-radius:6px}
.crow{display:flex;align-items:center;gap:6px;padding:4px 0}
.crow input[type=color]{width:32px;height:32px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
.crow input[type=text]{flex:1;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:6px 10px}
.crow .uses{font-size:11.5px;color:var(--faint);width:52px;text-align:right}

/* 팝업 메뉴 */
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:4px;min-width:190px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu small{color:var(--muted);margin-left:auto;font-size:11px;padding-left:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* 프로젝트 서랍 */
.drawer{position:fixed;inset:0;z-index:40;display:flex}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,12,16,.45)}
.dpanel{position:relative;width:min(380px,90vw);height:100%;background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(-24px);opacity:.4}}
.dhd{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dhd b{font-size:15px;margin-right:auto}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.dact .btn{justify-content:center}
.dlist{flex:1;overflow:auto;padding:4px 8px 12px}
.dsec{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:12px 8px 4px}
.prow{display:flex;align-items:center;gap:2px;border-radius:8px;padding:2px}
.prow:hover{background:var(--hover)}
.prow.cur{background:var(--accent-soft)}
.prow.drop-b{box-shadow:inset 0 -2px 0 var(--accent)} .prow.drop-t{box-shadow:inset 0 2px 0 var(--accent)}
.grip{cursor:grab;color:var(--faint);padding:0 2px;display:grid;place-items:center}
.grip svg.i{width:14px;height:14px}
.popen{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 6px;display:flex;flex-direction:column}
.popen b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.cur .popen b{color:var(--accent)}
.popen small{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.missing .popen b{color:var(--faint);text-decoration:line-through}
.pin.on{color:var(--accent)}
.pin.on svg.i{fill:currentColor}
.dfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}

/* 시작 화면 */
.welcome{max-width:520px;margin:10vh auto 0;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.welcome h1{font-size:24px;margin:0}
.welcome p{margin:0;color:var(--muted)}
.welcome .row{display:flex;gap:8px}
.wlist{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:10px}
.emptyep{border:1.5px dashed var(--line2);border-radius:12px;padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* 누름·전환 효과: 눌린 버튼이 살짝 들어가고, 색은 부드럽게 바뀐다 */
button,select,.place,textarea{transition:background-color .14s,border-color .14s,color .14s,box-shadow .14s,transform .1s ease-out,opacity .14s,filter .14s}
button:not(:disabled):active{transform:scale(.95)}
.btn:not(:disabled):active,.addrow:active,.endadd:not(:disabled):active{transform:scale(.97)}
.frame:not(.empty):active,.ct:active,.op:active,.cell>button.im:active,.strip button:active,.th>button:active{transform:scale(.97)}
.epb:active,.popen:active,.menu button:active{transform:scale(.985)}
.btn.pri:not(:disabled):active{filter:brightness(.92)}
.ct:hover,.op:hover{transform:translateY(-1px)} .ct:active,.op:active{transform:scale(.97)}
.card.flash{animation:cardIn .22s ease-out,flash 1.1s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
dialog[open]{animation:dlgIn .16s ease-out}
dialog[open]::backdrop{animation:fadeIn .16s ease-out}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}}
.menu{animation:menuIn .12s ease-out;transform-origin:top right}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.chpick:not([hidden]){animation:fadeIn .14s ease-out}
.toast{animation:toastIn .2s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13px;z-index:80;max-width:calc(100vw - 32px);box-shadow:var(--pop)}
.toast .undo{margin-left:12px;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
//VIZJS
/* 스틱맨 렌더 그림 (Blender 워크벤치, 1080x1920 원본을 줄인 사본). 엔진이 직접 못 만드는 렌즈 효과는 위에 얹는다 */
const OVL={
  FISH:'<svg class="ovl" viewBox="0 0 90 160" preserveAspectRatio="none"><path d="M0 0h90v160h-90zM45 6a43 74 0 1 0 .1 0z" fill="#000" fill-opacity=".88" fill-rule="evenodd"/></svg>',
  FLARE:'<svg class="ovl" viewBox="0 0 90 160" preserveAspectRatio="none"><g fill="#FFE9A8"><circle cx="70" cy="20" r="15" opacity=".75"/><circle cx="34" cy="64" r="5" opacity=".5"/><circle cx="20" cy="78" r="3" opacity=".45"/></g><line x1="0" y1="46" x2="90" y2="0" stroke="#FFE9A8" stroke-width="3" opacity=".55"/></svg>',
  GLOW:'<span class="ovl glow"></span>', TILTSHIFT:'<span class="ovl ts t"></span><span class="ovl ts b"></span>',
  MBLUR:'<span class="ovl tag">모션블러</span>', SLOWMO:'<span class="ovl tag">슬로모션 ×0.4</span>', RAMP:'<span class="ovl tag">빨라졌다 느려짐</span>',
  THIRDS:'<svg class="ovl" viewBox="0 0 90 160" preserveAspectRatio="none"><g stroke="#C4122F" stroke-width=".7" stroke-dasharray="2 2" opacity=".9"><line x1="30" y1="0" x2="30" y2="160"/><line x1="60" y1="0" x2="60" y2="160"/><line x1="0" y1="53" x2="90" y2="53"/><line x1="0" y1="107" x2="90" y2="107"/></g></svg>'};
const MOVE_LABEL={STATIC:"카메라 고정",PAN_L:"↶ 제자리 회전",PAN_R:"↷ 제자리 회전",TILT_U:"⤒ 고개 들기",TILT_D:"⤓ 고개 숙이기",PED_U:"↑ 카메라 상승",PED_D:"↓ 카메라 하강",TRUCK_L:"← 옆 이동",TRUCK_R:"→ 옆 이동",DOLLY_IN:"앞으로 이동",DOLLY_OUT:"뒤로 이동",ZOOM_IN:"렌즈만 당김",ZOOM_OUT:"렌즈만 밈",DOLLYZOOM:"배경만 늘어남"};
function PIC(d,code){
  const src=d==="move"?`cam/move_${code}.webp`:`cam/${d}_${code}.jpg`;
  let o="";
  if(d==="size")o=VZ.sizeMap(code);
  else if(d==="lens"||d==="comp")o=OVL[code]||"";
  else if(d==="move"&&MOVE_LABEL[code])o=`<span class="ovl tag">${MOVE_LABEL[code]}</span>`;
  return `<span class="pic${d==="lens"&&code==="MBLUR"?" mb":""}"><img src="${src}" alt="" loading="lazy" decoding="async">${o}</span>`;
}

/* 아이콘 */
const IC={
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>',
  save:'<path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/>',open:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  exp:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  pin:'<path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v6"/>',grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  check:'<path d="m5 12 5 5 9-10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',caret:'<path d="m7 10 5 5 5-5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const withIc=(id,n)=>{const b=document.getElementById(id);b.insertAdjacentHTML("afterbegin",ic(n))};

const DIMS=["size","angle","face","comp"], W={size:3,angle:2,comp:2,face:1};
const FIELDS=["size","angle","face","comp","move","lens"];
const PALETTE=["#E2574C","#3F7FD6","#D49A1F","#2E9C7A","#8E5CC2","#C2457A","#7A5A3A","#555E66","#1C9BB8","#8A938D"];
const TEXTS=[["body","대본 본문","장면 설명, 지문 등을 붙여넣거나 적어 주세요"],["dialog","대사","인물: 대사"],["note","연출 메모","카메라·연기·편집 메모"]];
const RATIOS=[["9:16","세로 9:16"],["16:9","가로 16:9"],["1:1","정사각 1:1"],["4:5","세로 4:5"]];
let TAX,REFS,REF={},ULIB=[],FILE=null,NAME="",PROJ=null,EPID=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name=(d,code)=>{const it=TAX[d].items.find(x=>x[0]===code);return it?it[1]:code};
const item=(d,code)=>TAX[d].items.find(x=>x[0]===code)||TAX[d].items[0];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));

/* 프로젝트 자료 */
const curEp=()=>PROJ.eps.find(e=>e.id===EPID)||PROJ.eps[0];
const cutNo=(ep,pos)=>`${ep.no}-${String(pos+1).padStart(2,"0")}`;
function findCut(id){for(const ep of PROJ.eps){const i=ep.cuts.findIndex(c=>c.id===id);if(i>=0)return {ep,i,cut:ep.cuts[i]}}return null}
const charColor=n=>(PROJ.chars.find(c=>c.name===n)||{}).color||"#999";
// 화면 비율: 컷마다 따로 정하지 않으면 프로젝트 기본 비율을 따른다
const arOf=c=>(c&&c.ratio)||PROJ.ratio||"9:16";
const arNum=r=>{const [w,h]=r.split(":").map(Number);return w/h};
const arCss=r=>r.replace(":"," / ");
const vertical=r=>arNum(r)<1;
function newCut(prev){
  return {id:uid("c"),place:prev?prev.place:"",body:"",dialog:"",note:"",
    size:prev?prev.size:"MS",angle:prev?prev.angle:"EYE",face:prev?prev.face:"FRONT",comp:prev?prev.comp:"SINGLE",move:"STATIC",lens:"NORMAL",
    chars:prev?[...prev.chars]:[],refs:[]};
}

/* 레퍼런스: 기본 레퍼런스 "b:번호" + 내 레퍼런스 "u:아이디" */
function refInfo(k){
  if(!k)return null;
  if(k.startsWith("b:")){const r=REF[k.slice(2)];return r?{k,kind:"b",t:r.t,x:r.x??50,r}:null}
  const u=ULIB.find(x=>x.id===k.slice(2));return u?{k,kind:"u",t:u.t||{},x:50,u}:null;
}
const allRefs=()=>[...ULIB.map(u=>refInfo("u:"+u.id)),...REFS.map(r=>({k:"b:"+r.i,kind:"b",t:r.t,x:r.x??50,r}))];
function score(c,ri,dims){let s=0;for(const d of dims){if(ri.t[d]&&ri.t[d]===c[d])s+=W[d]}return s}
function cands(c,dims=DIMS,pool=allRefs()){return pool.map((ri,j)=>[score(c,ri,dims),j,ri]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(x=>x[2])}
// 기본 레퍼런스는 원본 비율 그대로(짧은 변 720px) data/ref/번호.jpg. 컷 비율에 맞춰 잘라 보이고, 초점 x로 가로 위치를 맞춘다
const refSrc=ri=>ri.kind==="u"?"userlib/"+encodeURIComponent(ri.u.file):`data/ref/${ri.r.i}.jpg`;
function paint(root){root.querySelectorAll("img[data-k]").forEach(el=>{const ri=refInfo(el.dataset.k);if(!ri)return;el.style.objectPosition=ri.x+"% 50%";el.decoding="async";el.onerror=()=>el.style.visibility="hidden";el.src=refSrc(ri)})}
function tagsHtml(ri,c){return DIMS.filter(d=>ri.t[d]).map(d=>`<span class="tg${c&&c[d]===ri.t[d]?" hit":""}" title="${esc(TAX[d].label)}">${esc(name(d,ri.t[d]))}</span>`).join("")}
function srcHtml(ri){
  if(ri.kind==="u")return `<div class="src">내 레퍼런스 · ${esc(ri.u.name||ri.u.file)}</div>`;
  const r=ri.r;return `<div class="src"><a href="${esc(r.p)}" target="_blank" rel="noopener">${({pinterest:"Pinterest","film-grab":"FILMGRAB",unsplash:"Unsplash"})[r.s]||r.s} 원본 ↗</a></div>`;
}

/* 카드 */
function cardHtml(ep,c,pos){
  const no=cutNo(ep,pos),refs=c.refs.map(refInfo).filter(Boolean),r0=refs[0];
  const strip=cands(c).filter(x=>!c.refs.includes(x.k)).slice(0,8);
  const tile=d=>`<button class="ct${r0&&r0.t[d]&&r0.t[d]===c[d]?" hit":""}" data-act="cam" data-f="${d}" title="${esc(item(d,c[d])[3])}">${PIC(d,c[d])}<span class="k">${TAX[d].label}</span><span class="v">${esc(name(d,c[d]))}</span></button>`;
  const tipS=item("size",c.size),tipM=item("move",c.move),tipA=item("angle",c.angle),ar=arOf(c),vt=vertical(ar)?4:3;
  const first=pos===0,last=pos===ep.cuts.length-1;

function addRefs(id,keys){const f=findCut(id);let n=0;for(const k of keys)if(!f.cut.refs.includes(k)){f.cut.refs.push(k);n++}if(n){commit();rerenderCard(id)}return n}
function rmRef(id,k){const f=findCut(id);f.cut.refs=f.cut.refs.filter(x=>x!==k);commit();rerenderCard(id)}

// 내 사진: 긴 변 1600px JPEG로 줄여 내 레퍼런스 폴더에 저장하고, 이 컷 카메라 설정으로 분류해 둔다
async function shrink(src){
  const img=new Image();img.src=src;await img.decode();
  const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement("canvas");
  cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.9);
}
const fileUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function addOwn(id,items){
  if(!items.length)return;const c=findCut(id).cut;toast("사진을 추가하는 중…");

    const ents=await window.conti.libAdd(out);ULIB.push(...ents);addRefs(id,ents.map(x=>"u:"+x.id));
    toast(`사진 ${ents.length}장을 추가했어요 · 내 레퍼런스에도 저장됨`);if($("#pick").open)drawPick();
  }catch(e){toast("사진을 추가하지 못했어요: "+e.message)}
}

/* 저장 · 되돌리기 · 앞으로가기 */
let HIST=[],HI=-1,DIRTY=false,autoT=null,commitT=null;
const snap=()=>JSON.stringify(PROJ);
const hm=()=>new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
function setSave(t,cls){const s=$("#save");s.hidden=false;s.textContent=t;s.className="save "+(cls||"")}
function updHist(){$("#tbUndo").disabled=HI<=0;$("#tbRedo").disabled=HI>=HIST.length-1}
function resetHist(){clearTimeout(commitT);commitT=null;HIST=[snap()];HI=0;DIRTY=false;updHist();window.conti.setDirty(false)}
function commit(){
  clearTimeout(commitT);commitT=null;
  const s=snap();if(s===HIST[HI])return;
  HIST=HIST.slice(0,HI+1);HIST.push(s);if(HIST.length>300)HIST.shift();HI=HIST.length-1;
  markDirty();
}
function commitSoon(ms){clearTimeout(commitT);commitT=setTimeout(commit,ms)}
function flushCommit(){if(commitT)commit()}
function markDirty(){DIRTY=true;window.conti.setDirty(true);setSave("저장 안 됨","busy");updHist();clearTimeout(autoT);autoT=setTimeout(autosave,3000)}
async function autosave(){
  clearTimeout(autoT);flushCommit();if(!PROJ||!DIRTY)return;
  try{const r=await window.conti.autosave(PROJ);if(r){DIRTY=false;setSave(`자동 저장됨 · ${hm()}`,"ok")}}
  catch(e){setSave("자동 저장 실패","busy")}
}
async function save(as){
  if(!PROJ)return;flushCommit();clearTimeout(autoT);
  try{const r=await window.conti.save(PROJ,as);if(!r)return;FILE=r.path;NAME=r.name;showName();DIRTY=false;setSave(`저장됨 · ${hm()}`,"ok");toast("저장했어요: "+r.name);refreshDrawer()}
  catch(e){toast("저장하지 못했어요: "+e.message)}
}
// 기록의 i번째 상태로 화면을 되돌린다 (스크롤 위치는 그대로)
function restore(i){HI=i;PROJ=JSON.parse(HIST[i]);if(!PROJ.eps.some(e=>e.id===EPID))EPID=PROJ.eps[0].id;const y=$("#main").scrollTop;render();$("#main").scrollTop=y;markDirty()}
function undo(){flushCommit();if(HI>0){restore(HI-1);toast("되돌렸어요")}}
function redo(){flushCommit();if(HI<HIST.length-1){restore(HI+1);toast("다시 적용했어요")}}

function toast(t,undoFn){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="toast";d.textContent=t;
  if(undoFn){const b=document.createElement("button");b.className="undo";b.textContent="되돌리기";b.onclick=()=>{d.remove();undoFn()};d.appendChild(b)}
  document.body.appendChild(d);setTimeout(()=>d.remove(),undoFn?7000:2600)}

/* 묻기 창 (이름 입력·확인) */
function ask({title,text,fields=[],ok="확인",danger=false}){
  return new Promise(res=>{
    $("#askTitle").textContent=title;
    $("#askBody").innerHTML=(text?`<p>${esc(text)}</p>`:"")+fields.map(f=>`<label>${esc(f.label)}${f.type==="select"?`<select data-k="${f.k}">${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(f.value)===v?" selected":""}>${esc(l)}</option>`).join("")}</select>`:`<input data-k="${f.k}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.type==="number"?'min="0"':""}>`}</label>`).join("");
    $("#askOk").textContent=ok;$("#askOk").className="btn "+(danger?"danger":"pri");
    const dlg=$("#ask");dlg.returnValue="";
    dlg.onclose=()=>{if(dlg.returnValue!=="ok")return res(null);if(!fields.length)return res(true);res(Object.fromEntries([...$("#askBody").querySelectorAll("[data-k]")].map(el=>[el.dataset.k,el.value])))};
    dlg.showModal();const inp=$("#askBody").querySelector("input");if(inp){inp.focus();inp.select()}else $("#askOk").focus();

function popMenu(anchor,items){

  document.body.appendChild(m);const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+"px";m.style.top=(r.bottom+h+8>innerHeight?r.top-h-4:r.bottom+4)+"px";
  setTimeout(()=>document.addEventListener("click",closeMenu,{once:true}),0);

// 끌어서 순서 바꾸기. 고정/일반 경계를 넘어가면 고정 여부도 따라 바뀐다
let dragP=null;
$("#dlist").addEventListener("dragstart",e=>{const r=e.target.closest(".prow");if(!r)return;dragP=r.dataset.p;e.dataTransfer.effectAllowed="move"});
$("#dlist").addEventListener("dragover",e=>{const r=e.target.closest(".prow");if(!dragP||!r)return;e.preventDefault();document.querySelectorAll(".prow").forEach(x=>x.classList.remove("drop-t","drop-b"));const b=r.getBoundingClientRect();r.classList.add(e.clientY<b.top+b.height/2?"drop-t":"drop-b")});
$("#dlist").addEventListener("drop",e=>{
  const r=e.target.closest(".prow");if(!dragP||!r)return;e.preventDefault();
  const before=r.classList.contains("drop-t"),p=PL.find(x=>x.path===dragP),t=PL.find(x=>x.path===r.dataset.p);dragP=null;if(!p||p===t)return drawDrawer();
  const list=PL.filter(x=>x!==p);p.pinned=t.pinned;list.splice(list.indexOf(t)+(before?0:1),0,p);
  saveOrder([...list.filter(x=>x.pinned),...list.filter(x=>!x.pinned)]);
});
$("#dlist").addEventListener("dragend",()=>{dragP=null;document.querySelectorAll(".prow").forEach(x=>x.classList.remove("drop-t","drop-b"))});

/* 내보내기 */
function resolved(){
  return PROJ.eps.map(ep=>({no:ep.no,title:ep.title,cuts:ep.cuts.map((c,i)=>({no:cutNo(ep,i),id:c.id,ratio:arOf(c),place:c.place||"",chars:c.chars,body:c.body||"",dialog:c.dialog||"",note:c.note||"",
    camera:Object.fromEntries(FIELDS.map(f=>[f,{label:TAX[f].label,code:c[f],name:name(f,c[f])}])),
    refs:c.refs.map(refInfo).filter(Boolean).map(ri=>({key:ri.k,x:ri.x,source:ri.kind==="u"?"내 레퍼런스":ri.r.s,file:ri.kind==="u"?ri.u.name||ri.u.file:ri.r.f,page:ri.kind==="u"?undefined:ri.r.p,tags:Object.fromEntries(DIMS.filter(d=>ri.t[d]).map(d=>[TAX[d].label,name(d,ri.t[d])]))}))}))}));
}
// 레퍼런스를 화면과 같은 비율로 잘라 JPEG로 (긴 변 720px)
async function cropRef(ref,ratio){
  const ri=refInfo(ref.key);if(!ri)return null;
  const img=new Image();img.src=refSrc(ri);await img.decode();
  const W=img.naturalWidth,H=img.naturalHeight,a=arNum(ratio);
  let w=Math.min(W,Math.round(H*a)),h=Math.min(H,Math.round(w/a));
  const sx=Math.round((W-w)*(ref.x/100)),sy=Math.round((H-h)/2);
  const cv=document.createElement("canvas");if(a<1){cv.height=720;cv.width=Math.round(720*a)}else{cv.width=720;cv.height=Math.round(720/a)}
  cv.getContext("2d").drawImage(img,sx,sy,w,h,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.86);
}
// 이미지 하나를 못 읽어도 나머지는 내보낸다
async function withImages(eps){const out={};for(const ep of eps)for(const c of ep.cuts){const l=[];for(const r of c.refs){const d=await cropRef(r,c.ratio).catch(()=>null);if(d)l.push(d)}if(l.length)out[c.no]=l}return out}
const refFile=(c,k)=>k?`${c.no}_${k+1}.jpg`:`${c.no}.jpg`;
function exportJson(eps,withImgs){
  return JSON.stringify({format:"conti-board-export",version:2,title:NAME,exported_at:new Date().toISOString(),
    default_ratio:PROJ.ratio,
    readme:"episodes[].cuts[] 순서가 실제 컷 순서다. ratio=그 컷의 화면 비율. body=대본 본문, dialog=대사, note=연출 메모. camera 각 항목은 한글 이름(name)과 코드(code). refs[0]이 대표 레퍼런스이고 image는 같은 폴더의 9:16 이미지 경로. project는 앱에서 다시 열 때 쓰는 원본.",
    characters:PROJ.chars.map(c=>c.name),
    episodes:eps.map(ep=>({title:ep.title,no:ep.no,cut_count:ep.cuts.length,cuts:ep.cuts.map(c=>Object.assign({},c,{refs:c.refs.map((r,k)=>({image:withImgs?`refs/${refFile(c,k)}`:undefined,source:r.source,file:r.file,page:r.page,tags:r.tags}))}))})),
    project:PROJ},null,1);
}
function exportMd(eps){
  const L=[`# ${NAME} — 스토리보드`,"",`내보낸 시각: ${new Date().toLocaleString("ko-KR")}  `,`기본 화면 비율: ${PROJ.ratio}  `,`등장인물: ${PROJ.chars.map(c=>c.name).join(", ")||"없음"}  `,`화별 컷 수: ${eps.map(e=>`${e.title} ${e.cuts.length}컷`).join(" · ")}`,""];
  const block=(label,t)=>[`- ${label}:`,...(t?t.split("\n").map(x=>`  > ${x}`):["  > (없음)"])];
  for(const ep of eps){
    L.push(`## ${ep.title} (${ep.cuts.length}컷)`,"");
    for(const c of ep.cuts){
      L.push(`### ${c.no}${c.place?" · "+c.place:""}`,"",`- 화면 비율: ${c.ratio}`);
      L.push(`- 레퍼런스: ${c.refs.length?c.refs.map((r,k)=>`![${c.no}](refs/${refFile(c,k)}) ${Object.values(r.tags).join(" / ")||r.source}`).join(" · "):"없음"}`);
      L.push(`- 등장인물: ${c.chars.length?c.chars.join(", "):"없음"}`);
      for(const f of FIELDS)L.push(`- ${c.camera[f].label}: ${c.camera[f].name} (${c.camera[f].code})`);
      L.push(...block("대본 본문",c.body),...block("대사",c.dialog),...block("연출 메모",c.note),"");
    }
  }
  return L.join("\n");
}
function cutBlock(c,imgs){
  const cam=FIELDS.map(f=>`<tr><th>${esc(c.camera[f].label)}</th><td>${esc(c.camera[f].name)}</td></tr>`).join("");
  const im=imgs||[],a=arNum(c.ratio),iw=a<1?118:230,ih=Math.round(iw/a),ar=`aspect-ratio:${arCss(c.ratio)}`;
  return `<section class="cut" id="x${c.no}"><div class="ch"><b>${c.no}</b><span>${esc(c.place)}</span><span>${c.ratio}</span></div>
  <div class="cb" style="grid-template-columns:${iw}px 230px 1fr"><div><div class="im" style="width:${iw}px;height:${ih}px">${im[0]?`<img src="${im[0]}">`:"<span>레퍼런스 없음</span>"}</div>${im.length>1?`<div class="ims" style="width:${iw}px">${im.slice(1,4).map(s=>`<img src="${s}" style="${ar}">`).join("")}</div>`:""}</div>
  <div><table>${cam}</table><p class="who"><b>등장인물</b> ${esc(c.chars.join(", ")||"없음")}</p></div>
  <div class="tx">${c.body?`<p><b>대본 본문</b><br>${esc(c.body)}</p>`:""}${c.dialog?`<blockquote>${esc(c.dialog)}</blockquote>`:""}<p><b>연출 메모</b><br>${esc(c.note||"없음")}</p></div></div></section>`;
}
function printHtml(eps,imgs,forPng){
  const css=`*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#15181A;background:#fff;font-size:12px;line-height:1.45}
  h1{font-size:20px;margin:0 0 6px}h2{font-size:16px;margin:0 0 8px;page-break-before:always}h2.first{page-break-before:auto}
  .wrap{${forPng?"padding:16px;width:1160px":""}}
  .cut{border:1px solid #C9CEC7;border-radius:8px;margin:0 0 10px;break-inside:avoid;page-break-inside:avoid;overflow:hidden;background:#fff}
  .ch{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#F2F3F0;border-bottom:1px solid #C9CEC7}.ch b{font-family:Consolas,Menlo,monospace;font-size:13px}.ch span{color:#5B635E}
  .cb{display:grid;grid-template-columns:118px 230px 1fr;gap:12px;padding:10px}
  .im{width:118px;height:210px;border-radius:5px;overflow:hidden;background:#eee;display:grid;place-items:center;color:#888}.im img{width:100%;height:100%;object-fit:cover;display:block}
  .ims{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:118px;margin-top:4px}.ims img{width:100%;object-fit:cover;border-radius:3px;display:block}
  table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #E4E7E2;vertical-align:top}th{color:#5B635E;font-weight:600;width:84px;font-size:11px}
  .who{margin:8px 0 0}.tx p{margin:0 0 6px;white-space:pre-wrap}
  blockquote{margin:0 0 6px;padding:6px 10px;background:#F5F6F3;border-left:3px solid #2F66F0;white-space:pre-wrap;font-family:"Batang","AppleMyungjo","Nanum Myeongjo",serif;font-size:12.5px}`;
  const body=eps.filter(ep=>ep.cuts.length).map((ep,k)=>`<h2 class="${k?"":"first"}">${esc(ep.title)} · ${ep.cuts.length}컷</h2>`+ep.cuts.map(c=>cutBlock(c,imgs[c.no])).join("")).join("");
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>${css}</style></head><body><div class="wrap">${forPng?"":`<h1>${esc(NAME)} — 콘티북</h1>`}${body}</div></body></html>`;
}
async function runExport(kind){
  if(!PROJ)return;flushCommit();toast("내보내는 중…");
  try{
    const eps=resolved();let r;
    if(kind==="json")r=await window.conti.exportJson(NAME,exportJson(eps,false));
    else{
      const imgs=await withImages(eps);
      if(kind==="ai"){const files={};eps.forEach(ep=>ep.cuts.forEach(c=>(imgs[c.no]||[]).forEach((d,k)=>files[refFile(c,k)]=d)));r=await window.conti.exportAi(NAME,exportMd(eps),exportJson(eps,true),files)}
      else if(kind==="pdf")r=await window.conti.exportPdf(NAME,printHtml(eps,imgs,false));
      else if(kind==="png")r=await window.conti.exportPng(NAME,printHtml(eps,imgs,true),eps.flatMap(e=>e.cuts.map(c=>c.no)));
      else if(kind==="xlsx"){
        const sheets=eps.map(e=>({no:e.no,title:e.title,rows:e.cuts.map(c=>({no:c.no,ratio:c.ratio,wide:arNum(c.ratio)>=1,place:c.place,chars:c.chars.join(", "),size:c.camera.size.name,angle:c.camera.angle.name,face:c.camera.face.name,comp:c.camera.comp.name,move:c.camera.move.name,lens:c.camera.lens.name,body:c.body,dialog:c.dialog,note:c.note,refn:c.refs.length,ref:c.refs.map(x=>x.file).join("\n")}))}));
        const first={};Object.entries(imgs).forEach(([no,l])=>first[no]=l[0]);
        r=await window.conti.exportXlsx(NAME,sheets,first);
      }
    }
    toast(r?"내보냈어요: "+r.path:"내보내기를 취소했어요");return r;
  }catch(e){toast("내보내기 실패: "+e.message)}
}
$("#tbExp").onclick=e=>{e.stopPropagation();popMenu($("#tbExp"),[["AI용 폴더",()=>runExport("ai"),"","md · json · 이미지"],["PDF 콘티북",()=>runExport("pdf")],["엑셀 (.xlsx)",()=>runExport("xlsx")],["컷 카드 이미지 (PNG)",()=>runExport("png")],["프로젝트 파일 (.json)",()=>runExport("json")]])};

/* 테마 */
function theme(){return document.documentElement.dataset.theme}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("conti-theme",t)}catch(_){}drawThemeBtn()}
function drawThemeBtn(){const b=$("#tbTheme"),d=theme()==="dark";b.innerHTML=ic(d?"sun":"moon");b.title=d?"밝은 화면으로":"어두운 화면으로";b.setAttribute("aria-label",b.title)}

$("#tbUndo").onclick=undo;$("#tbRedo").onclick=redo;

window.conti.onMenu(ch=>{
  if(ch==="save")save(false);else if(ch==="saveAs")save(true);
  else if(ch==="undo"){if(!document.activeElement.matches("input,textarea")||!PROJ)undo();else document.execCommand("undo")}
  else if(ch==="redo"){if(!document.activeElement.matches("input,textarea")||!PROJ)redo();else document.execCommand("redo")}
  else if(ch.startsWith("export:"))runExport(ch.slice(7));
  else if(ch==="new")newProject();else if(ch==="open")openFile();
  else if(ch==="drawer")$("#drawer").hidden?openDrawer():closeDrawer();
  else if(ch==="theme")setTheme(theme()==="dark"?"light":"dark");
});
window.conti.onBeforeClose(async()=>{try{await leave()}finally{window.conti.closeReady()}});
