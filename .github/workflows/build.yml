# 맥·윈도우 설치 파일 자동 빌드. main에 올리거나(push) Actions 탭에서 직접 실행하면 만들어지고,
# 결과는 저장소의 Releases(버전 v<package.json version>)에 올라간다. 같은 버전으로 다시 빌드하면 파일만 바뀐다.
# (설치 파일이 커서 Actions 보관 용량 대신 Releases에 둔다)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          # 맥·윈도우 작업이 동시에 만들 수 있어서, 이미 있으면 그대로 쓴다
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "Storyboard (스토리보드) $V" --notes-file RELEASE_NOTES.md || sleep 10
          gh release upload "$V" ${{ matrix.files }} --clobber
